name: Build WASM deps (locfit, apeglm)

# Builds the dependencies with no public WASM binary into a CRAN-like
# WebAssembly repo committed at wasm-repo/, which the deploy workflow serves at
# /<repo>/wasm/. Run manually (workflow_dispatch).
#
#   locfit  DESeq2 imports it; there is no wasm build anywhere.
#   apeglm  the ONLY shrinkage estimator this app offers, and likewise absent —
#           repo.r-wasm.org carries ashr but not apeglm, and bioc.r-universe
#           publishes no emscripten binary for it. Its compiled dependencies
#           (RcppEigen, RcppNumerical, bbmle, emdbook) DO exist there, so only
#           apeglm itself has to be built here. Until this workflow has run,
#           choosing apeglm in the browser fails at the install step.
on:
  workflow_dispatch:

permissions:
  contents: write
  # Needed to dispatch the deploy workflow below. Without it the default token
  # gets HTTP 403 "Resource not accessible by integration" — which is exactly
  # what happened, and the `|| echo` that used to be on that step swallowed it
  # so the build still went green with the binaries unpublished.
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the WASM binaries with no public build
        uses: r-wasm/actions/build-rwasm@v3
        with:
          packages: "local::./wasm-src/locfit, bioc::apeglm, bioc::Rsamtools, cran::XML"
          repo-path: "wasm-repo"
          strip: "demo, doc, examples, help, html, include, tests, vignette"
          webr-image: "ghcr.io/r-wasm/webr:main"
      - name: Commit the WASM repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf wasm-repo/.gitignore
          git add wasm-repo
          if git commit -m "Build locfit, apeglm, Rsamtools and XML WASM binaries"; then
            git push
          else
            echo "no changes to commit"
          fi
      # A push made with GITHUB_TOKEN does NOT trigger other workflows — GitHub
      # blocks that to prevent recursion. Not tolerated with `|| true`: a build
      # that produces binaries nobody serves is a failure, and hiding it behind
      # a green tick is how it went unnoticed the first time. So the deploy that would SERVE these
      # binaries never fires on its own, and the build goes green while the
      # files stay unpublished. It did exactly that on the apeglm build, which
      # had to be published by hand. Runs even when nothing was committed.
      - name: Publish the rebuilt repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy to GitHub Pages" --ref main
